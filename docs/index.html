      pl.life = 1.5;
      waxIntact--;

      // freeze the shard where it is, then move it as one rigid piece
      var arr = pl.geo.attributes.position.array;
      var cx = 0, cy = 0, cz = 0, cnt = arr.length / 3;
      for (var i = 0; i < cnt; i++) { cx += arr[i * 3]; cy += arr[i * 3 + 1]; cz += arr[i * 3 + 2]; }
      cx /= cnt; cy /= cnt; cz /= cnt;
      for (var j = 0; j < cnt; j++) {
        arr[j * 3] -= cx; arr[j * 3 + 1] -= cy; arr[j * 3 + 2] -= cz;
      }
      pl.geo.attributes.position.needsUpdate = true;
      pl.geo.computeVertexNormals();
      pl.mesh.position.set(cx, cy, cz);

      waxTmp.set(cx, cy, cz).normalize();
      pl.vel.copy(waxTmp).multiplyScalar(1.1 + Math.random() * 0.9);
      pl.vel.x += (Math.random() - 0.5) * 0.8;
      pl.vel.y += (Math.random() - 0.5) * 0.8;
      pl.vel.z += (Math.random() - 0.5) * 0.8;
      pl.spin.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5)
        .multiplyScalar(7);
      pl.mesh.material.transparent = true;
      pl.mesh.material.needsUpdate = true;

      for (var k = 0; k < pl.nbrs.length; k++) {
        if (!pl.nbrs[k].broken) pl.nbrs[k].limit *= 0.55;
      }
      crackSound();
    }

    function refreshWaxMesh() {
      for (var p = 0; p < plates.length; p++) {
        var pl = plates[p];
        if (pl.broken) continue;
        var arr = pl.geo.attributes.position.array, fv = pl.faceVerts;
        for (var a = 0; a < fv.length; a++) {
          var i3 = fv[a] * 3;
          var x = P[i3], y = P[i3 + 1], z = P[i3 + 2];
          var L = Math.sqrt(x * x + y * y + z * z) || 1;
          var s = (L + WAX_T) / L;
          arr[a * 3] = x * s; arr[a * 3 + 1] = y * s; arr[a * 3 + 2] = z * s;
        }
        pl.geo.attributes.position.needsUpdate = true;
        pl.geo.computeVertexNormals();
      }
    }

    function updateWax(dt) {
      if (!waxOn) return;
      for (var p = 0; p < plates.length; p++) {
        var pl = plates[p];
        if (!pl.broken) {
          if (pl.stress > pl.limit) breakPlate(pl);
          continue;
        }
        pl.life -= dt;
        if (pl.life <= 0) { pl.mesh.visible = false; continue; }
        pl.vel.y -= 3.2 * dt;                       // a little weight
        pl.mesh.position.addScaledVector(pl.vel, dt);
        pl.mesh.rotation.x += pl.spin.x * dt;
        pl.mesh.rotation.y += pl.spin.y * dt;
        pl.mesh.rotation.z += pl.spin.z * dt;
        pl.mesh.material.opacity = Math.min(1, pl.life / 0.7);
      }
      refreshWaxMesh();
    }

    // ---- what is inside ----------------------------------------------------
    var beadCount = 0, beadR = 0, BP = null, BV = null, beadMesh = null;
    var beadGeo = null, vdir = null, vrad = null;
    var dummy = new THREE.Object3D();
    var rustle = 0;

    function buildBeads(id) {
      fillId = id;
      shell.store("squishy-fill", id);
      if (beadMesh) {
        scene.remove(beadMesh);
        beadGeo.dispose();
        beadMesh.material.dispose();
        beadMesh = null;
      }
      var f = FILLS[id];
      beadCount = f.count;
      beadR = f.r;

      // A skin you cannot see through hides the whole point of a filling.
      var see = beadCount > 0;
      mesh.material.transparent = see;
      mesh.material.opacity = f.op;
      mesh.material.depthWrite = !see;
      mesh.material.needsUpdate = true;

      if (!beadCount) { BP = BV = null; return; }

      BP = new Float64Array(beadCount * 3);
      BV = new Float64Array(beadCount * 3);
      var reach = RADIUS - beadR - 0.04;
      for (var i = 0; i < beadCount; i++) {
        // rejection-free: a cube-root radius gives a uniform fill
        var u = Math.random(), ct = Math.random() * 2 - 1, ph = Math.random() * Math.PI * 2;
        var rr = reach * Math.cbrt(u), st = Math.sqrt(1 - ct * ct);
        BP[i * 3] = rr * st * Math.cos(ph);
        BP[i * 3 + 1] = rr * st * Math.sin(ph);
        BP[i * 3 + 2] = rr * ct;
      }

      beadGeo = new THREE.SphereGeometry(beadR, 8, 6);
      beadMesh = new THREE.InstancedMesh(beadGeo, new THREE.MeshStandardMaterial({
        roughness: f.rough, metalness: f.metal
      }), beadCount);
      beadMesh.frustumCulled = false;
      if (beadMesh.setColorAt) {
        var c = new THREE.Color();
        for (var k = 0; k < beadCount; k++) {
          c.setHSL(f.hue + Math.random() * 0.22, 0.55, 0.45 + Math.random() * 0.25);
          beadMesh.setColorAt(k, c);
        }
        if (beadMesh.instanceColor) beadMesh.instanceColor.needsUpdate = true;
      }
      scene.add(beadMesh);

      vdir = new Float64Array(n * 3);
      vrad = new Float64Array(n);
    }

    // Beads are kept in by the skin itself: the shell is star-shaped about its
    // centre, so its radius along a bead's own direction is the wall the bead
    // has to stay behind. Dent the shell and that wall moves in, which is what
    // shoves the beads aside.
    function stepBeads(dt) {
      if (!beadCount) return;
      var i, j, k3;

      var minRad = Infinity;
      for (i = 0; i < n; i++) {
        var px = P[i * 3], py = P[i * 3 + 1], pz = P[i * 3 + 2];
        var r = Math.sqrt(px * px + py * py + pz * pz) || 1e-6;
        vdir[i * 3] = px / r; vdir[i * 3 + 1] = py / r; vdir[i * 3 + 2] = pz / r;
        vrad[i] = r;
        if (r < minRad) minRad = r;
      }
      // Anything this far in cannot be touching the wall anywhere, so it does
      // not need the wall looked up at all. With five hundred specks of
      // glitter that is most of the work skipped.
      var safeIn = minRad - beadR;

      var fr = Math.pow(0.82, dt * 60);
      var moved = 0;

      for (i = 0; i < beadCount; i++) {
        k3 = i * 3;
        BP[k3] += BV[k3] * dt; BP[k3 + 1] += BV[k3 + 1] * dt; BP[k3 + 2] += BV[k3 + 2] * dt;

        fingers.forEach(function (fg) {
          var rr = params.fingerR + beadR;
          var dx = BP[k3] - fg.c.x, dy = BP[k3 + 1] - fg.c.y, dz = BP[k3 + 2] - fg.c.z;
          var d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= rr * rr || d2 < 1e-10) return;
          var s = rr / Math.sqrt(d2);
          BP[k3] = fg.c.x + dx * s; BP[k3 + 1] = fg.c.y + dy * s; BP[k3 + 2] = fg.c.z + dz * s;
        });

        var bx = BP[k3], by = BP[k3 + 1], bz = BP[k3 + 2];
        var bl = Math.sqrt(bx * bx + by * by + bz * bz);
        if (bl > 1e-6 && bl > safeIn) {
          var ux = bx / bl, uy = by / bl, uz = bz / bl;
          var best = -2, wall = RADIUS;
          for (j = 0; j < n; j++) {
            var dot = ux * vdir[j * 3] + uy * vdir[j * 3 + 1] + uz * vdir[j * 3 + 2];
            if (dot > best) { best = dot; wall = vrad[j]; }
          }
          var lim = wall - beadR;
          if (bl > lim) {
            var s2 = lim / bl;
            BP[k3] = bx * s2; BP[k3 + 1] = by * s2; BP[k3 + 2] = bz * s2;
            var vr = BV[k3] * ux + BV[k3 + 1] * uy + BV[k3 + 2] * uz;
            if (vr > 0) { BV[k3] -= vr * ux; BV[k3 + 1] -= vr * uy; BV[k3 + 2] -= vr * uz; }
          }
        }

        BV[k3] *= fr; BV[k3 + 1] *= fr; BV[k3 + 2] *= fr;
        moved += Math.abs(BV[k3]) + Math.abs(BV[k3 + 1]) + Math.abs(BV[k3 + 2]);
      }

      // Keep them apart, but only when there are few enough for it to matter;
      // glitter flakes overlapping is what glitter looks like.
      if (beadCount <= 200) {
        var sep = beadR * 2;
        for (i = 0; i < beadCount; i++) {
          for (j = i + 1; j < beadCount; j++) {
            var ax = BP[i * 3] - BP[j * 3];
            var ay = BP[i * 3 + 1] - BP[j * 3 + 1];
            var az = BP[i * 3 + 2] - BP[j * 3 + 2];
            var dd = ax * ax + ay * ay + az * az;
            if (dd >= sep * sep || dd < 1e-10) continue;
            var d = Math.sqrt(dd), push = (sep - d) / d * 0.5;
            ax *= push; ay *= push; az *= push;
            BP[i * 3] += ax; BP[i * 3 + 1] += ay; BP[i * 3 + 2] += az;
            BP[j * 3] -= ax; BP[j * 3 + 1] -= ay; BP[j * 3 + 2] -= az;
          }
        }
      }

      for (i = 0; i < beadCount; i++) {
        dummy.position.set(BP[i * 3], BP[i * 3 + 1], BP[i * 3 + 2]);
        dummy.updateMatrix();
        beadMesh.setMatrixAt(i, dummy.matrix);
      }
      beadMesh.instanceMatrix.needsUpdate = true;

      rustle -= dt;
      var speed = moved / beadCount;
      if (FILLS[fillId].sound === "rustle" && speed > 0.9 && rustle <= 0) {
        shell.audio.grain({ freq: 2600 + Math.random() * 900, amp: 0.05,
                            decay: 0.05, rate: [1.0, 1.6], q: 1.2 });
        rustle = 0.09;
      }
    }

    // A grain-filled skin does not rustle, it crackles: a dense run of very
    // short clicks for as long as the thing is being squeezed. Driving it off
    // the skin's own rate of change rather than the grains means it crunches
    // while you press and goes quiet the moment you stop.
    var crunchCool = 0;
    function crunchSound(dt, rate) {
      crunchCool -= dt;
      if (FILLS[fillId].sound !== "crunch") return;
      if (rate < 0.5 || crunchCool > 0) return;
      var hot = Math.min(1, rate / 4);
      for (var c = 0; c < 3; c++) {
        shell.audio.grain({
          freq: 2800 + Math.random() * 3200,
          amp: 0.03 + hot * 0.05,
          decay: 0.012, rate: [1.1, 1.9], q: 1.0
        });
      }
      shell.audio.buzz(3);
      crunchCool = 0.045;
    }

    // Signed volume of a closed mesh: sum of the tetrahedra each face makes
    // with the origin.
    function meshVolume() {
      var v = 0;
      for (var f = 0; f < faceCount; f++) {
        var a = faceIdx[f * 3] * 3, b = faceIdx[f * 3 + 1] * 3, c = faceIdx[f * 3 + 2] * 3;
        var ax = P[a], ay = P[a + 1], az = P[a + 2];
        var bx = P[b], by = P[b + 1], bz = P[b + 2];
        v += (ay * bz - az * by) * P[c] +
             (az * bx - ax * bz) * P[c + 1] +
             (ax * by - ay * bx) * P[c + 2];
      }
      return v / 6;
    }

    function solveVolume(k) {
      grad.fill(0);
      var v = 0, f, a, b, c, ax, ay, az, bx, by, bz, cx, cy, cz;
      for (f = 0; f < faceCount; f++) {
        a = faceIdx[f * 3] * 3; b = faceIdx[f * 3 + 1] * 3; c = faceIdx[f * 3 + 2] * 3;
        ax = P[a]; ay = P[a + 1]; az = P[a + 2];
        bx = P[b]; by = P[b + 1]; bz = P[b + 2];
        cx = P[c]; cy = P[c + 1]; cz = P[c + 2];
        v += (ay * bz - az * by) * cx + (az * bx - ax * bz) * cy + (ax * by - ay * bx) * cz;
        grad[a] += by * cz - bz * cy;        // 6 * dV/da = b x c
        grad[a + 1] += bz * cx - bx * cz;
        grad[a + 2] += bx * cy - by * cx;
        grad[b] += cy * az - cz * ay;        // 6 * dV/db = c x a
        grad[b + 1] += cz * ax - cx * az;
        grad[b + 2] += cx * ay - cy * ax;
        grad[c] += ay * bz - az * by;        // 6 * dV/dc = a x b
        grad[c + 1] += az * bx - ax * bz;
        grad[c + 2] += ax * by - ay * bx;
      }
      volume = v / 6;

      var sum = 0, i;
      for (i = 0; i < grad.length; i++) { grad[i] /= 6; sum += grad[i] * grad[i]; }
      if (sum < 1e-12) return;
      var lambda = -((volume - V0) / sum) * k;
      for (i = 0; i < grad.length; i++) P[i] += lambda * grad[i];
    }

    function solveEdges(k) {
      for (var e = 0; e < edgeCount; e++) {
        var i = edgeIdx[e * 2] * 3, j = edgeIdx[e * 2 + 1] * 3;
        var dx = P[j] - P[i], dy = P[j + 1] - P[i + 1], dz = P[j + 2] - P[i + 2];
        var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d < 1e-9) continue;
        var w = ((d - restLen[e]) / d) * 0.5 * k;
        P[i] += dx * w; P[i + 1] += dy * w; P[i + 2] += dz * w;
        P[j] -= dx * w; P[j + 1] -= dy * w; P[j + 2] -= dz * w;
      }
    }

    // A fingertip is a sphere: anything inside it gets pushed back out to its
    // surface, which is what actually makes the dent round and lets the skin
    // slide around the finger instead of sticking to it.
    function solveFingers() {
      fingers.forEach(function (fg) {
        var r = params.fingerR, r2 = r * r;
        var cx = fg.c.x, cy = fg.c.y, cz = fg.c.z;
        for (var i = 0; i < n; i++) {
          var k3 = i * 3;
          var dx = P[k3] - cx, dy = P[k3 + 1] - cy, dz = P[k3 + 2] - cz;
          var d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= r2) continue;
          if (d2 < 1e-10) { P[k3 + 1] = cy + r; continue; }
          var s = r / Math.sqrt(d2);
          P[k3] = cx + dx * s; P[k3 + 1] = cy + dy * s; P[k3 + 2] = cz + dz * s;
        }
      });
    }

    // Creep. An elastic skin always wants its original length back, which is
    // silicone. Let the rest length drift toward whatever length it is being
    // held at, and crawl back to the original afterwards, and you get the toys
    // that keep the dent for a moment: dough, and slow-rise foam.
    function creep(h) {
      var ky = 1 - Math.exp(-params.give * h);
      var kr = 1 - Math.exp(-params.back * h);
      for (var e = 0; e < edgeCount; e++) {
        var i = edgeIdx[e * 2] * 3, j = edgeIdx[e * 2 + 1] * 3;
        var dx = P[j] - P[i], dy = P[j + 1] - P[i + 1], dz = P[j + 2] - P[i + 2];
        var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        var r = restLen[e];
        r += (d - r) * ky;
        r += (rest0[e] - r) * kr;
        restLen[e] = r;
      }
    }

    function recenter() {
      var sx = 0, sy = 0, sz = 0, i;
      for (i = 0; i < n; i++) { sx += P[i * 3]; sy += P[i * 3 + 1]; sz += P[i * 3 + 2]; }
      sx /= n; sy /= n; sz /= n;
      for (i = 0; i < n; i++) {
        P[i * 3] -= sx; P[i * 3 + 1] -= sy; P[i * 3 + 2] -= sz;
        Prev[i * 3] -= sx; Prev[i * 3 + 1] -= sy; Prev[i * 3 + 2] -= sz;
      }
    }

    function syncGeometry() {
      var pa = geo.attributes.position.array;
      for (var i = 0; i < n * 3; i++) pa[i] = P[i];
      geo.attributes.position.needsUpdate = true;
      geo.computeVertexNormals();
    }

    // ---- sound -------------------------------------------------------------
    function squish(press) {
      shell.audio.grain({
        freq: press ? 210 : 330,
        amp: press ? 0.12 : 0.08,
        decay: press ? 0.13 : 0.09,
        rate: [0.3, 0.5], q: 0.9, type: "lowpass"
      });
      shell.audio.buzz(press ? 8 : 4);
    }

    // ---- camera ------------------------------------------------------------
    var orbit = { az: 0.5, el: 0.35, zoom: 1 };
    var fitDist = 7;

    // The ball is a ball: its mean radius never moves off 1.0x and a hard press
    // only pushes the silhouette out by about 3%. Measuring it every frame
    // bought nothing and cost everything -- each press nudged the camera back
    // and it never came forward again, so the toy slowly shrank as you played.
    // Frame it once from a fixed radius instead, and only on an actual change.
    function snapFit() {
      var vFov = camera.fov * Math.PI / 180;
      var hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      fitDist = Math.max((RADIUS * 1.12) / Math.sin(Math.min(vFov, hFov) / 2), 2);
    }

    function placeCamera() {
      var d = fitDist * orbit.zoom;
      scene.fog.color.copy(shell.fogColor);
      scene.fog.near = d * 0.9;
      scene.fog.far = d * 2.2;
      var ce = Math.cos(orbit.el), se = Math.sin(orbit.el);
      camera.position.set(d * ce * Math.sin(orbit.az), d * se, d * ce * Math.cos(orbit.az));
      camera.lookAt(0, 0, 0);
    }

    // ---- input -------------------------------------------------------------
    var raycaster = new THREE.Raycaster();
    var ndc = new THREE.Vector2();
    var fingers = new Map();      // pointerId -> { ndc, depth, pressIn, c }
    var orbitLast = new Map();
    var pointers = new Map();
    var pinch = null;
    var MAX_PRESS = RADIUS * 0.72;

    function down(ev) {
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 2) {
        var pts = Array.from(pointers.values());
        pinch = { d0: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), zoom0: orbit.zoom };
      }
      shell.ndc(ev, ndc);
      scene.updateMatrixWorld(true);
      raycaster.setFromCamera(ndc, camera);
      var hits = raycaster.intersectObject(mesh, false);
      if (hits.length) {
        fingers.set(ev.pointerId, {
          nx: ndc.x, ny: ndc.y,
          depth: hits[0].distance,
          pressIn: 0,
          c: new THREE.Vector3()
        });
        squish(true);
      } else {
        orbitLast.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      }
    }

    function move(ev) {
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

      if (pinch && pointers.size === 2) {
        var pts = Array.from(pointers.values());
        var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinch.d0 > 0) orbit.zoom = Math.max(0.5, Math.min(2.2, pinch.zoom0 * (pinch.d0 / d)));
        return;
      }

      if (orbitLast.has(ev.pointerId)) {
        var o = orbitLast.get(ev.pointerId);
        orbit.az -= (ev.clientX - o.x) * 0.008;
        orbit.el = Math.max(-1.2, Math.min(1.2, orbit.el + (ev.clientY - o.y) * 0.008));
        o.x = ev.clientX; o.y = ev.clientY;
        return;
      }

      var fg = fingers.get(ev.pointerId);
      if (fg) {
        shell.ndc(ev, ndc);
        fg.nx = ndc.x; fg.ny = ndc.y;
      }
    }

    function up(ev) {
      pointers.delete(ev.pointerId);
      if (pointers.size < 2) pinch = null;
      orbitLast.delete(ev.pointerId);
      if (fingers.has(ev.pointerId)) {
        fingers.delete(ev.pointerId);
        squish(false);
      }
    }

    // ---- frame -------------------------------------------------------------
    function update(dt, now) {
      // where each fingertip sphere sits this frame
      fingers.forEach(function (fg) {
        fg.pressIn = Math.min(MAX_PRESS, fg.pressIn + dt * RADIUS * 3.5);
        ndc.set(fg.nx, fg.ny);
        raycaster.setFromCamera(ndc, camera);
        fg.c.copy(raycaster.ray.direction)
          .multiplyScalar(fg.depth - params.fingerR + fg.pressIn)
          .add(raycaster.ray.origin);
      });

      var sub = 2, h = Math.min(dt, 1 / 40) / sub;
      var dampStep = Math.pow(params.damp, h * 60);

      for (var s = 0; s < sub; s++) {
        var i;
        for (i = 0; i < n * 3; i++) {
          Prev[i] = P[i];
          P[i] += Vel[i] * h;
        }
        for (var it = 0; it < 4; it++) {
          solveEdges(params.stiff);
          solveVolume(params.pressure);
          solveNet();
          solveWax();
          solveFingers();
        }
        var inv = 1 / h;
        for (i = 0; i < n * 3; i++) Vel[i] = (P[i] - Prev[i]) * inv * dampStep;
        creep(h);
        recenter();
      }

      syncGeometry();
      updateWax(dt);
      var vsum = 0;
      for (var q = 0; q < n * 3; q++) vsum += Math.abs(Vel[q]);
      crunchSound(dt, vsum / n);
      stepBeads(Math.min(dt, 1 / 40));
      placeCamera();
    }

    function resize(w, h) {
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      snapFit();
      placeCamera();
    }

    function rows() {
      return [
        shell.rowSeg("질감",
          Object.keys(TEXTURES).map(function (id) { return { v: id, label: TEXTURES[id].label }; }),
          textureId,
          function (id) {
            applyTexture(id);
            shell.refreshPanel();     // the sliders below have to follow
          }),
        shell.rowSlider("말랑기", 0.25, 1, 0.01, params.stiff,
          function (x) { return x.toFixed(2); },
          function (v) { params.stiff = v; }),
        shell.rowSlider("공기 압력", 0.2, 1, 0.02, params.pressure,
          function (x) { return x.toFixed(2); },
          function (v) { params.pressure = v; }),
        shell.rowSlider("되돌아오는 속도", 0.75, 0.985, 0.005, params.damp,
          function (x) { return x.toFixed(3); },
          function (v) { params.damp = v; }),
        shell.rowSlider("자국 남는 정도", 0, 10, 0.25, params.give,
          function (x) { return x.toFixed(2); },
          function (v) { params.give = v; }),
        shell.rowSlider("자국 사라지는 속도", 0.1, 8, 0.05, params.back,
          function (x) { return x.toFixed(2); },
          function (v) { params.back = v; }),
        shell.rowSlider("손가락 굵기", 0.25, 0.9, 0.01, params.fingerR,
          function (x) { return x.toFixed(2); },
          function (v) { params.fingerR = v; }),
        shell.rowSeg("속",
          Object.keys(FILLS).map(function (id) { return { v: id, label: FILLS[id].label }; }),
          fillId,
          function (v) { buildBeads(v); }),
        shell.rowSeg("겉",
          [{ v: "plain", label: "매끈" }, { v: "net", label: "그물" }, { v: "wax", label: "왁스" }],
          skinId,
          function (v) {
            skinId = v;
            netOn = v === "net";
            waxOn = v === "wax";
            shell.store("squishy-skin", v);
            // the net needs enough vertices to draw a line with
            if (netOn && params.detail < 3) {
              shell.store("squishy-detail", "3");
              build(3);
              shell.refreshPanel();
            } else {
              buildNet();
              buildWax();
            }
          }),
        shell.rowSeg("색",
          Object.keys(COLORS).map(function (id) { return { v: id, label: COLORS[id].label }; }),
          colorId,
          function (v) {
            colorId = v;
            mesh.material.color.setHex(COLORS[v].hex);
            shell.store("squishy-color", v);
          }),
        shell.rowSeg("해상도",
          [{ v: 1, label: "낮음" }, { v: 2, label: "보통" }, { v: 3, label: "높음" }],
          params.detail,
          function (d) { build(d); shell.store("squishy-detail", String(d)); }),
        shell.rowNote("누르면 들어가고 누른 자리 옆이 부풀어 오릅니다. 갇힌 공기의 부피가 유지되기 때문입니다. 손가락 여러 개로 동시에 눌러도 되고, 누른 채 끌면 자국이 따라옵니다. 배경을 끌면 시점이 돕니다.")
      ];
    }

    function hud() {
      return {
        text: TEXTURES[textureId].label + " · " + FILLS[fillId].label +
              (netOn ? " · 그물" : "") +
              (waxOn ? " · 왁스 " + waxIntact + "/" + plates.length : "") +
              " · 정점 " + n + " · 알갱이 " + beadCount +
              " · 부피 " + (volume / V0 * 100).toFixed(1) + "%" +
              " · 손가락 " + fingers.size,
        warn: Math.abs(volume / V0 - 1) > 0.08
      };
    }

    // Wax is one-shot by nature, and a grain bag never springs back, so both
    // need a way to start over.
    function resetBall() {
      for (var i = 0; i < n; i++) {
        P[i * 3] = restDir[i * 3] * RADIUS;
        P[i * 3 + 1] = restDir[i * 3 + 1] * RADIUS;
        P[i * 3 + 2] = restDir[i * 3 + 2] * RADIUS;
      }
      Prev.set(P);
      Vel.fill(0);
      restLen.set(rest0);
      syncGeometry();
      buildWax();
      if (beadCount) buildBeads(fillId);
    }

    build(params.detail);

    return {
      scene: scene, camera: camera,
      update: update, resize: resize,
      down: down, move: move, up: up,
      rows: rows, hud: hud,
      action: { label: "새 공", run: resetBall }
    };
  }

  /* ========================================================================
     SHELL: chrome, toy switching, frame loop
     ======================================================================== */

  var TOYS = [
    { id: "tangle", label: "탱클", make: makeTangle },
    { id: "keycap", label: "키캡", make: makeKeycap },
    { id: "squishy", label: "말랑이", make: makeSquishy }
  ];

  var built = {};
  var active = null, activeId = null;

  var toybar = document.getElementById("toybar");
  var panel = document.getElementById("panel");
  var hudEl = document.getElementById("hud");
  var bPanel = document.getElementById("bPanel");
  var bTheme = document.getElementById("bTheme");
  var bSound = document.getElementById("bSound");
  var bAction = document.getElementById("bAction");

  TOYS.forEach(function (t) {
    var b = mk("button", null, t.label);
    b.dataset.toy = t.id;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { switchTo(t.id); });
    toybar.appendChild(b);
  });

  function rebuildPanel() {
    while (panel.firstChild) panel.removeChild(panel.firstChild);
    active.rows().forEach(function (r) { panel.appendChild(r); });
    panel.appendChild(mk("hr"));
    panel.appendChild(rowToggle("진동", audio.haptics, function (v) {
      audio.haptics = v;
      store("fidget-haptics", v ? "1" : "0");
      if (v) audio.buzz(10);
    }));
  }

  function switchTo(id) {
    if (activeId === id) return;
    if (!built[id]) {
      var def = TOYS.filter(function (t) { return t.id === id; })[0];
      built[id] = def.make(shell);
    }
    active = built[id];
    activeId = id;
    Array.prototype.forEach.call(toybar.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.toy === id));
    });
    rebuildPanel();
    if (active.action) {
      bAction.hidden = false;
      bAction.textContent = active.action.label;
    } else {
      bAction.hidden = true;
    }
    resize();
    store("fidget-toy", id);
  }

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    // updateStyle must stay on. With it off the canvas gets no CSS size and is
    // laid out at its drawing-buffer size, so on a devicePixelRatio-2 phone it
    // renders twice the viewport and the centred toy lands in the corner. A
    // desktop at ratio 1 hides the bug completely.
    renderer.setSize(w, h);
    if (active) active.resize(w, h);
  }
  window.addEventListener("resize", resize);

  stage.addEventListener("pointerdown", function (ev) {
    audio.init();            // browsers only allow audio to start from a gesture
    // a pointer that is already gone throws here, and an uncaught throw would
    // swallow the press itself
    try { stage.setPointerCapture(ev.pointerId); } catch (e) { /* not capturable */ }
    if (active) active.down(ev);
  });
  stage.addEventListener("pointermove", function (ev) { if (active) active.move(ev); });
  stage.addEventListener("pointerup", function (ev) { if (active) active.up(ev); });
  stage.addEventListener("pointercancel", function (ev) { if (active) active.up(ev); });

  bPanel.addEventListener("click", function () {
    panel.hidden = !panel.hidden;
    bPanel.setAttribute("aria-expanded", String(!panel.hidden));
    // the readouts are workbench instruments; keep them with the workbench
    hudEl.hidden = panel.hidden;
  });

  bAction.addEventListener("click", function () {
    if (active && active.action) active.action.run();
  });

  // Theme. The page follows the phone by default, but "follow the phone" is not
  // always what you want from something you pick up to fiddle with, so let it
  // be overridden and remember the choice.
  var THEMES = ["system", "light", "dark"];
  var THEME_LABEL = { system: "자동", light: "밝게", dark: "어둡게" };
  var themeIdx = Math.max(0, THEMES.indexOf(store("fidget-theme") || "system"));

  function applyTheme() {
    var m = THEMES[themeIdx];
    if (m === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", m);
    bTheme.textContent = THEME_LABEL[m];
    readTheme();   // the clear colour and fog live in WebGL, not in CSS
    store("fidget-theme", m);
  }
  bTheme.addEventListener("click", function () {
    themeIdx = (themeIdx + 1) % THEMES.length;
    applyTheme();
  });

  bSound.addEventListener("click", function () {
    audio.on = !audio.on;
    bSound.setAttribute("aria-pressed", String(audio.on));
    store("fidget-sound", audio.on ? "1" : "0");
    if (audio.on) audio.init();
  });

  // ---- frame loop ----------------------------------------------------------
  var lastT = performance.now();
  var fpsAcc = 0, fpsCount = 0, lastHud = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (!active) return;

    active.update(dt, now);
    renderer.render(active.scene, active.camera);

    fpsAcc += dt; fpsCount++;
    if (!hudEl.hidden && now - lastHud > 220) {
      lastHud = now;
      var h = active.hud();
      hudEl.textContent = h.text + " · " + Math.round(fpsCount / Math.max(fpsAcc, 1e-6)) + " fps";
      hudEl.className = "hud" + (h.warn ? " warn" : "");
      fpsAcc = 0; fpsCount = 0;
    }
  }

  // ---- go ------------------------------------------------------------------
  if (store("fidget-sound") === "0") {
    audio.on = false;
    bSound.setAttribute("aria-pressed", "false");
  }
  if (store("fidget-haptics") === "0") audio.haptics = false;
  applyTheme();

  var startId = store("fidget-toy");
  if (!startId || !TOYS.some(function (t) { return t.id === startId; })) startId = "tangle";
  switchTo(startId);
  resize();
  requestAnimationFrame(frame);
})();
</script>


<script>
  // Installed copies run from the cache, so a reload alone will not pick up a
  // new build; the worker takes over as soon as it activates.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        // no HTTPS, or the host forbids workers: the toy still runs online
      });
    });
  }
</script>
